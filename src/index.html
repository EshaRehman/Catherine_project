<!doctype html>
<html lang="en">
  <head>

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' blob: data: http://localhost:9000 ws://localhost:9000 http://127.0.0.1:9000 ws://127.0.0.1:9000 http://localhost:8000 http://127.0.0.1:8000;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Lilita+One&display=swap"
      rel="stylesheet"
    />
    <title>Catherine</title>
  </head>

</html>
